  <head>

    <style>

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f7fa;
      }
      /* Vue 根容器占满全屏 */
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Vue 入口文件 -->
    <script type="module" src="/src/main.js"></script>
